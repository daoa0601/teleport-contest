name: Equivalence
# Always rerun the proofs and caller analysis. Only prepared C sources and
# downloaded Python packages are cached, never proof or classification results.
on:
  push:
    branches: [daoa/recovery-architecture, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: equivalence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  equivalence:
    # Exercise glibc assert expansions as well as the typed NetHack AST.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETHACK_RECORDER: ${{ github.workspace }}/nethack-c/recorder
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start runtime measurement
        run: |
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p .cache/equivalence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Install clang, build tools, and uv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang bison flex build-essential rsync python3-venv
          clang --version
          python3 -m venv .cache/uv-bootstrap
          .cache/uv-bootstrap/bin/pip install uv==0.13.5
          echo "$PWD/.cache/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned C sources
        run: |
          git submodule update --init --depth 1 nethack-c/upstream
          echo "NETHACK_SHA=$(git rev-parse HEAD:nethack-c/upstream)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nethack-c/recorder
            .cache/uv
          key: equivalence-${{ runner.os }}-${{ runner.arch }}-${{ env.NETHACK_SHA }}-${{ hashFiles('nethack-c/patches/**', 'nethack-c/build-recorder.sh', 'nethack-c/macosx-minimal', 'verification/**/*.py', 'verification/**/*.mjs', 'verification/**/*.c', 'verification/equivalence/uv.lock', 'verification/equivalence/pyproject.toml', '.github/workflows/equivalence.yml') }}
      - name: Prepare patched recorder sources and Lua headers
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Same source preparation as build-recorder.sh; only Lua needs building.
          rsync -a --exclude='.git' nethack-c/upstream/ nethack-c/recorder/
          cd nethack-c/recorder
          git init -q
          git -c gc.auto=0 add -A
          git -c user.email=build@local -c user.name=build commit -q -m baseline
          for patch in ../patches/*.patch; do git apply --recount "$patch"; done
          python3 -c 'import shutil; shutil.rmtree(".git")'
          sed -i.bak "s|^PREFIX=.*|PREFIX=$PWD/install|" sys/unix/hints/linux-minimal
          sh sys/unix/setup.sh sys/unix/hints/linux-minimal
          # fetch-Lua always exits 0 and stops at the first mirror that answers:
          # when www.lua.org times out, the tecgraf mirror's 404 page is saved as
          # the tarball. Check for the extracted header and fall back to the
          # nethack.org copy (same checksum) before giving up.
          for attempt in 1 2 3; do
            make fetch-lua
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            rm -rf lib/lua-*
            make fetch-lua-nhd
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            [ $attempt = 3 ] && exit 1
            rm -rf lib/lua-*; sleep 30
          done
          make CC=clang SYSCFLAGS=-DLUA_USE_POSIX include/nhlua.h
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Test C and JavaScript executor behavior
        working-directory: verification/equivalence
        run: uv run --locked python -m unittest -v test_executors test_queries test_proof_selection
      - name: Test ISAAC64 scoring target selection
        working-directory: verification/equivalence
        run: uv run --locked python ../isaac64/test_scoring_target.py
      - name: Cross-check native and scoring ISAAC64 outputs
        working-directory: verification/equivalence
        run: |
          /usr/bin/time -p uv run --locked ../isaac64/crosscheck.py 2>&1 | tee ../../.cache/equivalence/isaac64-crosscheck.txt
      - name: Test ledger acceptance and rejection
        working-directory: verification/equivalence
        run: uv run --locked ../test_ledgers.py
      - name: Prove fast claims, probes, and mutants
        working-directory: verification/equivalence
        run: |
          /usr/bin/time -p uv run --locked prove.py --skip-slow --check-ledger ../../docs/ledger/equivalence.tsv 2>&1 | tee ../../.cache/equivalence/proofs.txt
      - name: Report runtime and results
        if: always()
        run: |
          echo "Equivalence elapsed since checkout: $(($(date +%s) - VERIFICATION_STARTED)) seconds" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            for report in .cache/equivalence/proofs.txt .cache/equivalence/isaac64-crosscheck.txt; do
              if [ -f "$report" ]; then cat "$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equivalence
          path: .cache/equivalence
          retention-days: 30

  equivalence-callsites:
    # Run caller analysis in parallel with the fast proofs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start runtime measurement
        run: |
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p .cache/equivalence-callsites
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Install uv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv .cache/uv-bootstrap
          .cache/uv-bootstrap/bin/pip install uv==0.13.5
          echo "$PWD/.cache/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Read the pinned C revision for the shared cache
        run: |
          echo "NETHACK_SHA=$(git rev-parse HEAD:nethack-c/upstream)" >> "$GITHUB_ENV"
      # Restore without saving: the proof jobs prepare the recorder sources.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nethack-c/recorder
            .cache/uv
          key: equivalence-${{ runner.os }}-${{ runner.arch }}-${{ env.NETHACK_SHA }}-${{ hashFiles('nethack-c/patches/**', 'nethack-c/build-recorder.sh', 'nethack-c/macosx-minimal', 'verification/**/*.py', 'verification/**/*.mjs', 'verification/**/*.c', 'verification/equivalence/uv.lock', 'verification/equivalence/pyproject.toml', '.github/workflows/equivalence.yml') }}
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Test RNG call-site analysis
        working-directory: verification/equivalence
        run: uv run --locked python ../callsites/test_callsites.py
      - name: Check RNG caller domains
        run: |
          /usr/bin/time -p node --max-old-space-size=2048 verification/callsites/extract.mjs > .cache/equivalence-callsites/rng-callsites.json 2> .cache/equivalence-callsites/extract-time.txt
          cd verification/equivalence
          /usr/bin/time -p uv run --locked ../callsites/check.py ../../.cache/equivalence-callsites/rng-callsites.json --check-ledger ../../docs/ledger/rng-callsites.tsv 2>&1 | tee ../../.cache/equivalence-callsites/callsites.txt
      - name: Reject invalid-domain mutants at classified call sites
        run: |
          /usr/bin/time -p node --max-old-space-size=2048 verification/callsites/extract.mjs --mutate-domains > .cache/equivalence-callsites/rng-mutants.json 2> .cache/equivalence-callsites/mutant-extract-time.txt
          cd verification/equivalence
          /usr/bin/time -p uv run --locked python ../callsites/test_domains.py ../../.cache/equivalence-callsites/rng-callsites.json ../../.cache/equivalence-callsites/rng-mutants.json 2>&1 | tee ../../.cache/equivalence-callsites/callsite-mutants.txt
      - name: Report runtime and results
        if: always()
        run: |
          echo "Call-site elapsed since checkout: $(($(date +%s) - VERIFICATION_STARTED)) seconds" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            for report in .cache/equivalence-callsites/extract-time.txt .cache/equivalence-callsites/callsites.txt .cache/equivalence-callsites/mutant-extract-time.txt .cache/equivalence-callsites/callsite-mutants.txt; do
              if [ -f "$report" ]; then cat "$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equivalence-callsites
          path: .cache/equivalence-callsites
          retention-days: 30

  difftest:
    # Keep native differential tests within their own 30-minute budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETHACK_RECORDER: ${{ github.workspace }}/nethack-c/recorder
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start runtime measurement
        run: |
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p .cache/difftest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Install clang, build tools, and uv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang bison flex build-essential rsync python3-venv libncurses-dev
          clang --version
          python3 -m venv .cache/uv-bootstrap
          .cache/uv-bootstrap/bin/pip install uv==0.13.5
          echo "$PWD/.cache/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned C sources
        run: |
          git submodule update --init --depth 1 nethack-c/upstream
          echo "NETHACK_SHA=$(git rev-parse HEAD:nethack-c/upstream)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nethack-c/recorder
            .cache/uv
          key: difftest-${{ runner.os }}-${{ runner.arch }}-${{ env.NETHACK_SHA }}-${{ hashFiles('nethack-c/patches/**', 'nethack-c/build-recorder.sh', 'nethack-c/macosx-minimal', 'verification/**/*.py', 'verification/**/*.mjs', 'verification/**/*.c', 'verification/difftest/uv.lock', 'verification/difftest/pyproject.toml', '.github/workflows/equivalence.yml') }}
      - name: Prepare patched recorder sources and Lua headers
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Prepare Lua and the data generator; the harness builds game objects.
          rsync -a --exclude='.git' nethack-c/upstream/ nethack-c/recorder/
          cd nethack-c/recorder
          git init -q
          git -c gc.auto=0 add -A
          git -c user.email=build@local -c user.name=build commit -q -m baseline
          for patch in ../patches/*.patch; do git apply --recount "$patch"; done
          python3 -c 'import shutil; shutil.rmtree(".git")'
          sed -i.bak "s|^PREFIX=.*|PREFIX=$PWD/install|" sys/unix/hints/linux-minimal
          sh sys/unix/setup.sh sys/unix/hints/linux-minimal
          # fetch-Lua always exits 0 and stops at the first mirror that answers:
          # when www.lua.org times out, the tecgraf mirror's 404 page is saved as
          # the tarball. Check for the extracted header and fall back to the
          # nethack.org copy (same checksum) before giving up.
          for attempt in 1 2 3; do
            make fetch-lua
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            rm -rf lib/lua-*
            make fetch-lua-nhd
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            [ $attempt = 3 ] && exit 1
            rm -rf lib/lua-*; sleep 30
          done
          make CC=clang SYSCFLAGS=-DLUA_USE_POSIX include/nhlua.h
          make -C util CC=clang SYSCFLAGS=-DLUA_USE_POSIX makedefs
          make -C dat bogusmon
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Check that every difftest mutant applies
        run: node verification/difftest/port.mjs --check-mutants
      - name: Build the native difftest harness and run its differential batch
        working-directory: verification/difftest
        run: |
          set -o pipefail
          /usr/bin/time -p uv run --locked run.py --build 2>&1 | tee ../../.cache/difftest/build-and-run.txt
      - name: Run the difftest behavior tests
        working-directory: verification/difftest
        run: |
          set -o pipefail
          /usr/bin/time -p uv run --locked python -m pytest -q 2>&1 | tee ../../.cache/difftest/pytest.txt
      - name: Report runtime and results
        if: always()
        run: |
          echo "Difftest elapsed since checkout: $(($(date +%s) - VERIFICATION_STARTED)) seconds" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            for report in .cache/difftest/build-and-run.txt .cache/difftest/pytest.txt; do
              if [ -f "$report" ]; then cat "$report"; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: difftest
          path: |
            .cache/difftest
            .cache/fv-difftest/*.stderr
            .cache/fv-difftest/harness-error.json
            .cache/fv-difftest/mismatches.jsonl
          retention-days: 30

  slow-equivalence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: equivalence
    strategy:
      fail-fast: false
      matrix:
        # Interleaved groups of the slow claims. The heaviest single claim
        # (same_race:tables) is ~10 min locally and ~2x that on a hosted
        # runner, so every shard stays well under the budget; the timeout
        # keeps headroom above that claim's worst case plus setup.
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETHACK_RECORDER: ${{ github.workspace }}/nethack-c/recorder
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SLOW_SHARDS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start runtime measurement
        run: |
          echo "VERIFICATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p .cache/equivalence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
      - name: Install clang, build tools, and uv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang bison flex build-essential rsync python3-venv
          clang --version
          python3 -m venv .cache/uv-bootstrap
          .cache/uv-bootstrap/bin/pip install uv==0.13.5
          echo "$PWD/.cache/uv-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned C sources
        run: |
          git submodule update --init --depth 1 nethack-c/upstream
          echo "NETHACK_SHA=$(git rev-parse HEAD:nethack-c/upstream)" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nethack-c/recorder
            .cache/uv
          key: equivalence-${{ runner.os }}-${{ runner.arch }}-${{ env.NETHACK_SHA }}-${{ hashFiles('nethack-c/patches/**', 'nethack-c/build-recorder.sh', 'nethack-c/macosx-minimal', 'verification/**/*.py', 'verification/**/*.mjs', 'verification/**/*.c', 'verification/equivalence/uv.lock', 'verification/equivalence/pyproject.toml', '.github/workflows/equivalence.yml') }}
      - name: Prepare patched recorder sources and Lua headers
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Same source preparation as build-recorder.sh; only Lua needs building.
          rsync -a --exclude='.git' nethack-c/upstream/ nethack-c/recorder/
          cd nethack-c/recorder
          git init -q
          git -c gc.auto=0 add -A
          git -c user.email=build@local -c user.name=build commit -q -m baseline
          for patch in ../patches/*.patch; do git apply --recount "$patch"; done
          python3 -c 'import shutil; shutil.rmtree(".git")'
          sed -i.bak "s|^PREFIX=.*|PREFIX=$PWD/install|" sys/unix/hints/linux-minimal
          sh sys/unix/setup.sh sys/unix/hints/linux-minimal
          # fetch-Lua always exits 0 and stops at the first mirror that answers:
          # when www.lua.org times out, the tecgraf mirror's 404 page is saved as
          # the tarball. Check for the extracted header and fall back to the
          # nethack.org copy (same checksum) before giving up.
          for attempt in 1 2 3; do
            make fetch-lua
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            rm -rf lib/lua-*
            make fetch-lua-nhd
            [ -f lib/lua-5.4.8/src/lua.h ] && break
            [ $attempt = 3 ] && exit 1
            rm -rf lib/lua-*; sleep 30
          done
          make CC=clang SYSCFLAGS=-DLUA_USE_POSIX include/nhlua.h
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Prove slow claims, probes, and mutants
        working-directory: verification/equivalence
        run: |
          /usr/bin/time -p uv run --locked prove.py --slow-only --shard "${{ matrix.shard }}/${SLOW_SHARDS}" --check-ledger ../../docs/ledger/equivalence.tsv 2>&1 | tee ../../.cache/equivalence/slow-proofs.txt
      - name: Report slow proof runtime and results
        if: always()
        run: |
          echo "Slow-job shard ${{ matrix.shard }}/${SLOW_SHARDS} elapsed since checkout: $(($(date +%s) - VERIFICATION_STARTED)) seconds" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .cache/equivalence/slow-proofs.txt ]; then
            cat .cache/equivalence/slow-proofs.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equivalence-slow-shard-${{ matrix.shard }}
          path: .cache/equivalence
          retention-days: 30
