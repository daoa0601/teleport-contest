name: Score
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Approved hash of the scorer, oracle, frozen, and native patch sources.
      # Set it as a repository secret after reviewing measurement changes.
      MEASUREMENT_HASH: ${{ secrets.MEASUREMENT_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned development dependencies
        run: npm ci

      - name: Compile strict TypeScript and run behavior tests
        run: npm test

      - name: Check measurement sources against the approved hash
        if: ${{ env.MEASUREMENT_HASH != '' }}
        run: node src/scripts/check-measurement-guard.mts hash --expect "$MEASUREMENT_HASH"

      - name: Check verified-function ledger on public sessions
        run: |
          node scripts/triage-holdout.mjs public .cache/ci-public
          node scripts/rng-function-table.mjs .cache/ci-public --check-ledger docs/ledger/public-rng.tsv

      - name: Overlay frozen runtime adapters
        run: |
          cp frozen/isaac64.js js/isaac64.js
          cp frozen/terminal.js js/terminal.js
          cp frozen/storage.js js/storage.js

      - name: Score public sessions
        run: |
          node frozen/ps_test_runner.mjs sessions/ \
            2>score-stderr.txt | tee score-stdout.txt
          cat score-stderr.txt >&2

      - name: Extract score summary
        run: node scripts/summarize-score.mjs

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: score-results
          path: |
            score-summary.json
            score-stdout.txt
